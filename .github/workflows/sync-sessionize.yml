name: Sync Sessionize

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Do not share the pages concurrency group with Deploy.yml — a sync run's
# GITHUB_SHA is the pre-push commit, and deploy-pages tags that SHA. Sharing
# the group also cancelled in-flight Deploy runs. Deploy is triggered below via
# workflow_run on the Deploy workflow after a successful data push.

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Sessionize data
        run: npm run sync:sessionize
        env:
          SESSIONIZE_ENDPOINT_ID: ${{ vars.SESSIONIZE_ENDPOINT_ID || 'vxssqlh8' }}

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/sessions.json src/data/speakers.json
          if git diff --staged --quiet; then
            echo "No Sessionize data changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync Sessionize data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
