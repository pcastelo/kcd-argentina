name: Sync Sessionize

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Sessionize data
        run: npm run sync:sessionize
        env:
          SESSIONIZE_ENDPOINT_ID: ${{ vars.SESSIONIZE_ENDPOINT_ID || 'vxssqlh8' }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/sessions.json src/data/speakers.json
          if git diff --staged --quiet; then
            echo "No Sessionize data changes to commit"
          else
            git commit -m "chore: sync Sessionize data"
            git push
          fi
